org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric - same versions as the Little Weather project (Minecraft 26.3, Java 25, Loom 1.19).
# If a newer Fabric API for 26.3 exists, bump fabric_api_version (https://fabricmc.net/develop/).
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.165.0+26.3

# Mod
# version = the release number. Bump it for every update, and add .github/changes/<version>.md.
# Every push builds a release tagged v<version>; old releases are kept, never overwritten.
archives_base_name=SmartChests
version=1.0.0
group=com.smartchests
